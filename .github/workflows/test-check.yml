name: test-check

on:
  push:
    branches:
      - source

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: make install

      - name: Run lint
        run: make lint

      - name: Run tests
        run: make test

      - name: Setup git config
        run: |
          git config user.name "Bot"
          git config user.email "<>"

      - name: Prepare template branch
        run: |
          git checkout --orphan main

          git rm -rf .

          git checkout source -- .

          rm -rf __tests__
          rm -f vitest.config.js
          rm -f .github/workflows/test-check.yml

          git add -A

          git commit --allow-empty --no-verify \
            -m "Rebuild template (auto)"

          git push -f origin main